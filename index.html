<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoahPhola Game Hub</title>
    <style>
        /* --- VISUALS: GAMING AESTHETIC --- */
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }

        h1 {
            text-align: center;
            font-style: italic;
            text-transform: uppercase;
            background: -webkit-linear-gradient(#00e5ff, #00ff99);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* --- THE GAMIFIED CARD --- */
        .player-card {
            background: #111;
            border-radius: 15px;
            padding: 0;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            transition: all 0.3s ease;
        }

        /* Dynamic Ranks */
        .rank-strip {
            padding: 8px 15px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }
        
        .rank-gold { background: linear-gradient(90deg, #d4af37, #f7ef8a); color: #000; }
        .rank-diamond { background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff; }
        .rank-graphene { background: linear-gradient(90deg, #2c3e50, #000000); color: #00e5ff; border-bottom: 1px solid #00e5ff; }

        .card-body { padding: 15px; }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .player-name { font-size: 1.4rem; font-weight: 800; }
        .player-xp { font-size: 0.9rem; color: #888; }

        /* XP Progress Bar */
        .xp-container {
            width: 100%;
            background-color: #333;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .xp-fill {
            height: 100%;
            background-color: #00ff99;
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px #00ff99;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 10px 5px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-val { font-size: 1.1rem; font-weight: bold; }
        .stat-lbl { font-size: 0.6rem; color: #aaa; text-transform: uppercase; margin-top: 2px; }

        /* "On Fire" Animation */
        .on-fire {
            animation: burn 0.8s infinite alternate;
            border: 1px solid #ffaa00;
        }

        @keyframes burn {
            from { box-shadow: 0 0 10px #ffaa00, inset 0 0 10px #ffaa00; }
            to { box-shadow: 0 0 25px #ff4500, inset 0 0 20px #ff4500; }
        }

        #actionBtn {
            background: linear-gradient(45deg, #00e5ff, #00ff99);
            border: none;
            color: #000;
            width: 100%;
            padding: 15px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>WoahPhola</h1>
    <div class="subtitle">Season 1 // Ranked Match</div>

    <div id="game-dashboard">
        </div>

    <button id="actionBtn" onclick="startGame()">Start Match Simulation</button>

    <script>
        // --- GAMIFIED DATA ---
        const players = [
            { id: 1, name: "THABO", xp: 1240, maxXp: 2000, rank: "rank-gold", rankName: "GOLD II" },
            { id: 2, name: "JENNY", xp: 2890, maxXp: 3000, rank: "rank-diamond", rankName: "DIAMOND I" },
            { id: 3, name: "SIPHO", xp: 450, maxXp: 1000, rank: "rank-graphene", rankName: "GRAPHENE" }
        ];

        let gameActive = false;

        function renderGame() {
            const board = document.getElementById('game-dashboard');
            board.innerHTML = '';

            players.forEach(p => {
                // Calculate XP %
                const xpPercent = (p.xp / p.maxXp) * 100;

                const card = document.createElement('div');
                card.className = 'player-card';
                card.id = `card-${p.id}`;
                card.innerHTML = `
                    <div class="rank-strip ${p.rank}">
                        <span>${p.rankName}</span>
                        <span>LVL ${Math.floor(p.xp/500)}</span>
                    </div>
                    <div class="card-body">
                        <div class="player-header">
                            <div class="player-name">${p.name}</div>
                            <div class="player-xp">${p.xp} XP</div>
                        </div>
                        <div class="xp-container">
                            <div class="xp-fill" style="width: ${xpPercent}%" id="xp-bar-${p.id}"></div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-val" id="force-${p.id}">0G</div>
                                <div class="stat-lbl">Impact</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val" id="speed-${p.id}">0</div>
                                <div class="stat-lbl">Sprint (km/h)</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val" style="color:#00ff99" id="sym-${p.id}">100%</div>
                                <div class="stat-lbl">Symmetry</div>
                            </div>
                        </div>
                    </div>
                `;
                board.appendChild(card);
            });
        }

        function startGame() {
            if(gameActive) return;
            gameActive = true;
            document.getElementById('actionBtn').innerText = "MATCH LIVE - RECORDING...";
            
            setInterval(() => {
                players.forEach(p => {
                    // 1. Random Impact Force
                    const force = Math.floor(Math.random() * 50);
                    document.getElementById(`force-${p.id}`).innerText = force + "G";

                    // 2. "On Fire" Effect if Force > 40G
                    const card = document.getElementById(`card-${p.id}`);
                    if(force > 40) {
                        card.classList.add('on-fire');
                        // Add XP dynamically
                        const bar = document.getElementById(`xp-bar-${p.id}`);
                        let currentWidth = parseFloat(bar.style.width);
                        if(currentWidth < 100) bar.style.width = (currentWidth + 2) + "%";
                    } else {
                        card.classList.remove('on-fire');
                    }

                    // 3. Speed Burst
                    const speed = (Math.random() * (32 - 15) + 15).toFixed(1);
                    document.getElementById(`speed-${p.id}`).innerText = speed;

                    // 4. Symmetry (Safety)
                    document.getElementById(`sym-${p.id}`).innerText = (Math.floor(Math.random() * (100 - 90) + 90)) + "%";
                });
            }, 800);
        }

        renderGame();
    </script>
</body>
</html>
