<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WoahPhola Gen-2 App</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Default Theme */
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-accent: #58a6ff;
            --btn-grad-1: #1f6feb;
            --btn-grad-2: #238636;
            --glow: 0 0 20px rgba(88, 166, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            transition: background 0.5s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER & TIME --- */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: bold;
        }

        /* --- LOGO STYLE (Fun but Business) --- */
        .brand-header {
            margin-bottom: 25px;
            position: relative;
            z-index: 10;
        }

        .woah-logo {
            font-family: 'Russo One', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 
                3px 3px 0px #000000, 
                0 0 25px var(--text-accent); /* Glow matches team color */
            margin: 0;
            transform: skew(-5deg);
        }

        .woah-sub {
            font-family: 'Roboto', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 5px;
            font-weight: bold;
            color: rgba(255,255,255,0.6);
        }

        /* --- TEAM SELECTOR --- */
        .team-selector-container {
            margin-bottom: 20px;
            width: 100%;
            max-width: 300px;
            position: relative;
            z-index: 10;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        /* --- TEAM CREST (Floating) --- */
        .team-crest {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            margin-bottom: 10px;
            z-index: 10;
            transition: all 0.5s ease;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* --- DATA CARD --- */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(15px);
        }

        #forceValue {
            font-family: 'Russo One', sans-serif;
            font-size: 5rem;
            color: var(--text-accent);
            margin: 5px 0;
            line-height: 1;
            text-shadow: var(--glow);
        }

        .unit { font-size: 1.2rem; opacity: 0.8; font-weight: 300; }
        .label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; }

        /* --- BUTTONS --- */
        #connectBtn {
            background: linear-gradient(135deg, var(--btn-grad-1), var(--btn-grad-2));
            border: 2px solid rgba(255,255,255,0.2);
            padding: 18px 50px;
            color: white;
            font-family: 'Russo One', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 300px;
            text-transform: uppercase;
            z-index: 10;
            transition: transform 0.1s;
        }
        #connectBtn:active { transform: scale(0.95); }

        #status {
            margin-top: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
            z-index: 10;
        }

        .powered-by {
            margin-top: auto;
            padding-top: 30px;
            font-size: 0.6rem;
            opacity: 0.3;
            z-index: 10;
        }

    </style>
</head>
<body onload="startTime()">

    <div class="top-bar">
        <div id="currentDate">Loading...</div>
        <div id="currentTime" class="live-time">00:00</div>
    </div>

    <div class="brand-header">
        <h1 class="woah-logo">WOAH PHOLA!!</h1>
        <div class="woah-sub">GEN-2 ACTIVE SYSTEM</div>
    </div>

    <div class="team-selector-container">
        <select id="teamSelect" onchange="changeTeam()">
            <option value="default">Select Your Squad...</option>
            <option value="chiefs">Kaizer Chiefs</option>
            <option value="sundowns">Mamelodi Sundowns</option>
            <option value="pirates">Orlando Pirates</option>
            <option value="capetown">Cape Town City</option>
            <option value="supersport">SuperSport United</option>
            <option value="amazulu">AmaZulu FC</option>
            <option value="stellies">Stellenbosch FC</option>
            <option value="arrows">Golden Arrows</option>
            <option value="galaxy">TS Galaxy</option>
            <option value="chippa">Chippa United</option>
            <option value="sekhukhune">Sekhukhune United</option>
            <option value="polokwane">Polokwane City</option>
            <option value="richardsbay">Richards Bay</option>
            <option value="royalam">Royal AM</option>
            <option value="springboks">Springboks (Rugby)</option>
        </select>
    </div>

    <img id="teamLogo" src="" alt="Team Logo" style="display: none;" class="team-crest">

    <div class="card">
        <div class="label">Kick Force</div>
        <div id="forceValue">0.0</div>
        <span class="unit">G-FORCE</span>
    </div>

    <button id="connectBtn" onclick="connectToPod()">SYNC POD</button>
    <div id="status">Status: Disconnected</div>

    <div class="powered-by">POWERED BY WOAHPHOLA V2.0</div>

    <script>
        // --- 1. TIME & DATE FUNCTION ---
        function startTime() {
            const today = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('currentDate').innerHTML = today.toLocaleDateString('en-ZA', options);
            
            let h = today.getHours();
            let m = today.getMinutes();
            let s = today.getSeconds();
            m = checkTime(m);
            s = checkTime(s);
            document.getElementById('currentTime').innerHTML = h + ":" + m + ":" + s;
            setTimeout(startTime, 1000);
        }
        function checkTime(i) { return (i < 10) ? "0" + i : i; }

        // --- 2. TEAM DATABASE (Updated with Stable Links) ---
        const teams = {
            default: {
                colors: ['#0d1117', '#161b22', '#ffffff', '#58a6ff', '#1f6feb', '#238636'],
                logo: null 
            },
            chiefs: {
                // Kaizer Chiefs (Black/Gold)
                colors: ['#000000', '#1a1a1a', '#FDB913', '#FDB913', '#FDB913', '#d4a017'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/2/22/Kaizer_Chiefs_logo.png'
            },
            sundowns: {
                // Sundowns (Blue/Yellow)
                colors: ['#055098', '#033a70', '#FDE018', '#FDE018', '#FDE018', '#efd016'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/e/e0/Mamelodi_Sundowns_logo.svg'
            },
            pirates: {
                // Pirates (Black/Red/White)
                colors: ['#1b1b1b', '#000000', '#ffffff', '#ff0000', '#ff0000', '#990000'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/a/a2/Orlando_Pirates_logo.svg'
            },
            capetown: {
                // CT City (Blue/Yellow)
                colors: ['#001B3A', '#001226', '#FFD200', '#FFD200', '#0064a7', '#001B3A'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/a/ac/Cape_Town_City_FC_logo.svg'
            },
            supersport: {
                // SuperSport (Blue/White)
                colors: ['#122F5F', '#0c2042', '#ffffff', '#00ADEF', '#00ADEF', '#122F5F'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/0/07/SuperSport_United_logo.svg'
            },
            amazulu: {
                // AmaZulu (Green)
                colors: ['#00573F', '#003324', '#ffffff', '#C4D600', '#C4D600', '#00573F'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/7/70/AmaZulu_FC_logo.svg'
            },
            stellies: {
                // Stellenbosch (Maroon/Gold)
                colors: ['#681827', '#3d0e17', '#CFA34E', '#CFA34E', '#CFA34E', '#681827'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/0/07/Stellenbosch_FC_logo.svg'
            },
            arrows: {
                // Golden Arrows (Green/Gold)
                colors: ['#006337', '#004225', '#FCE100', '#FCE100', '#FCE100', '#006337'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/4/4e/Golden_Arrows_logo.svg'
            },
            galaxy: {
                // TS Galaxy (Black/Red)
                colors: ['#000000', '#1a1a1a', '#ffffff', '#e20613', '#e20613', '#000000'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/b/b2/TS_Galaxy_FC_logo.svg'
            },
            chippa: {
                // Chippa (Blue/White)
                colors: ['#1E3F78', '#112342', '#ffffff', '#FF0000', '#1E3F78', '#FF0000'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/8/87/Chippa_United_FC_logo.svg'
            },
            sekhukhune: {
                // Sekhukhune (Maroon/Gold)
                colors: ['#650018', '#40000f', '#ffffff', '#cfb53b', '#cfb53b', '#650018'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/1/1d/Sekhukhune_United_FC_logo.svg'
            },
            polokwane: {
                // Polokwane (Orange)
                colors: ['#FF6600', '#cc5200', '#ffffff', '#000000', '#000000', '#FF6600'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/5/53/Polokwane_City_FC_logo.svg'
            },
            richardsbay: {
                // Richards Bay (Blue/Gold)
                colors: ['#003366', '#002244', '#ffffff', '#B8860B', '#B8860B', '#003366'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/5/50/Richards_Bay_FC_logo.svg'
            },
            royalam: {
                // Royal AM (Black/Gold)
                colors: ['#000000', '#111111', '#C5B358', '#C5B358', '#C5B358', '#000000'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/7/7b/Royal_AM_FC_logo.svg'
            },
            springboks: {
                // Springboks (Green/Gold)
                colors: ['#003b28', '#002619', '#ffffff', '#ffb81c', '#ffb81c', '#003b28'],
                logo: 'https://upload.wikimedia.org/wikipedia/en/c/c3/Springbok_logo.svg'
            }
        };

        function changeTeam() {
            const selector = document.getElementById('teamSelect');
            const teamKey = selector.value;
            const theme = teams[teamKey];
            const root = document.documentElement;
            const logoImg = document.getElementById('teamLogo');

            // 1. Update Colors
            root.style.setProperty('--bg-color', theme.colors[0]);
            root.style.setProperty('--card-bg', theme.colors[1]);
            root.style.setProperty('--text-main', theme.colors[2]);
            root.style.setProperty('--text-accent', theme.colors[3]);
            root.style.setProperty('--btn-grad-1', theme.colors[4]);
            root.style.setProperty('--btn-grad-2', theme.colors[5]);
            root.style.setProperty('--glow', `0 0 25px ${theme.colors[3]}66`);

            // 2. Update Logo & Background Watermark
            if(theme.logo) {
                logoImg.src = theme.logo;
                logoImg.style.display = "block";
                
                // Massive Background Watermark
                document.body.style.backgroundImage = `url('${theme.logo}')`;
                document.body.style.backgroundSize = "150%"; // Giant Zoom
                document.body.style.backgroundPosition = "center 20%";
                document.body.style.backgroundRepeat = "no-repeat";
                document.body.style.backgroundBlendMode = "overlay"; // Blend with color
                
            } else {
                logoImg.style.display = "none";
                document.body.style.backgroundImage = "none";
            }
        }

        // --- 3. BLUETOOTH LOGIC ---
        const serviceUuid = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const charUuid = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let device, server, service, characteristic;

        async function connectToPod() {
            try {
                const btn = document.getElementById('connectBtn');
                btn.innerText = "SCANNING...";
                
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'WoahPhola Pod' }],
                    optionalServices: [serviceUuid]
                });

                btn.innerText = "CONNECTING...";
                server = await device.gatt.connect();
                service = await server.getPrimaryService(serviceUuid);
                characteristic = await service.getCharacteristic(charUuid);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleKick);

                document.getElementById('status').innerText = "Status: CONNECTED";
                document.getElementById('status').style.color = "#00ff00";
                btn.innerText = "POD ACTIVE";
                
                // Add extra glow on connect
                document.getElementById('teamLogo').style.filter = "drop-shadow(0 0 30px #ffffff)";

            } catch (error) {
                console.log(error);
                document.getElementById('connectBtn').innerText = "RETRY SYNC";
                document.getElementById('status').innerText = "Connection Failed. Try Chrome.";
            }
        }

        function handleKick(event) {
            const value = new TextDecoder().decode(event.target.value);
            document.getElementById('forceValue').innerText = value;
            document.body.style.opacity = "0.6";
            setTimeout(() => { document.body.style.opacity = "1"; }, 100);
        }
    </script>
</body>
</html>
