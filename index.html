<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoahPhola Bootstrap MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --accent-teal: #00d2ff;
        }

        body {
            background-color: var(--bg-color);
            /* --- LOGO AS BACKGROUND WATERMARK --- */
            background-image: linear-gradient(rgba(13, 17, 23, 0.9), rgba(13, 17, 23, 0.9)), url('logo.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 60%;
            background-attachment: fixed;
            
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* --- LOGO AT TOP --- */
        .main-logo {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px var(--accent-teal));
        }

        .brand-name {
            font-family: 'Russo One', sans-serif;
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card {
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            margin-top: 30px;
            text-align: center;
        }

        #forceValue {
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent-teal);
        }

        button {
            background: var(--accent-teal);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-family: 'Russo One', sans-serif;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <img src="logo.jpg" alt="Woah Phola Logo" class="main-logo">
    <h1 class="brand-name">Woah Phola!!</h1>

    <div class="card">
        <p>CURRENT STRIKE FORCE</p>
        <div id="forceValue">0.0</div>
        <p>G-FORCE</p>
    </div>

    <button onclick="simulate()">SYNC SMART POD</button>

    <script>
        function simulate() {
            const val = (Math.random() * 25).toFixed(1);
            document.getElementById('forceValue').innerText = val;
        }
    </script>
</body>
</html>
